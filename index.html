<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spike Runner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- <script src="/_sdk/element_sdk.js"></script> -->
  <style>
    body {
      box-sizing: border-box;
    }
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    
    * { margin: 0; padding: 0; }
    
    .game-font {
      font-family: 'Press Start 2P', monospace;
    }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff8855; }
      50% { box-shadow: 0 0 30px #00ff88, 0 0 60px #00ff8888; }
    }
    
    @keyframes enemy-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    @keyframes boost-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    
    @keyframes death-flash {
      0%, 100% { background: #1a0a0a; }
      50% { background: #ff0000; }
    }
    
    .death-animation {
      animation: death-flash 0.1s ease-in-out 3;
    }
    
    .boost-pad {
      animation: boost-pulse 0.5s ease-in-out infinite;
    }
    
    .enemy {
      animation: enemy-float 1s ease-in-out infinite;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <!-- <script src="/_sdk/data_sdk.js" type="text/javascript"></script> -->
 </head>
 <body class="h-full bg-gray-900 overflow-hidden">
  <div id="game-container" class="h-full w-full relative flex items-center justify-center"><!-- Start Screen -->
   <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-b from-gray-900 via-purple-900 to-gray-900 z-50">
    <h1 id="game-title" class="game-font text-3xl md:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-500 to-red-500 mb-8 text-center px-4" style="animation: pulse-glow 2s ease-in-out infinite;">SPIKE RUNNER</h1>
    <p class="game-font text-xs md:text-sm text-gray-400 mb-8 text-center px-4">Super Hard Platformer</p><button id="start-btn" class="game-font text-sm bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white px-8 py-4 rounded-lg transition-all transform hover:scale-105">START GAME</button>
    <div class="mt-8 game-font text-xs text-gray-500 text-center px-4">
     <p>ARROW KEYS / WASD to move</p>
     <p class="mt-2">SPACE / W / UP to jump</p>
    </div>
   </div><!-- Game Canvas -->
   <canvas id="game-canvas" class="bg-gray-900"></canvas><!-- HUD -->
   <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start game-font text-xs hidden">
    <div class="bg-black/70 px-4 py-2 rounded-lg"><span class="text-gray-400">LEVEL</span> <span id="level-display" class="text-yellow-400 ml-2">1</span>
    </div>
    <div class="bg-black/70 px-4 py-2 rounded-lg"><span class="text-gray-400">DEATHS</span> <span id="death-display" class="text-red-400 ml-2">0</span>
    </div>
    <div id="mute-btn" class="bg-black/70 px-4 py-2 rounded-lg cursor-pointer hover:bg-black/80 transition-colors"><span class="text-gray-400">SOUND</span> <span id="mute-indicator" class="text-green-400 ml-2">ON</span>
    </div>
   </div><!-- Level Complete -->
   <div id="level-complete" class="absolute inset-0 flex-col items-center justify-center bg-black/90 z-40 hidden">
    <h2 class="game-font text-2xl text-green-400 mb-4">LEVEL COMPLETE!</h2>
    <p class="game-font text-sm text-gray-400 mb-8">Get ready for the next challenge...</p><button id="next-level-btn" class="game-font text-sm bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-8 py-4 rounded-lg">NEXT LEVEL</button>
   </div><!-- Game Complete -->
   <div id="game-complete" class="absolute inset-0 flex-col items-center justify-center bg-gradient-to-b from-gray-900 via-green-900 to-gray-900 z-40 hidden">
    <h2 class="game-font text-3xl text-yellow-400 mb-4">🏆 YOU WIN! 🏆</h2>
    <p class="game-font text-sm text-gray-300 mb-2">All levels completed!</p>
    <p class="game-font text-xs text-gray-500 mb-2">Total Deaths: <span id="final-deaths" class="text-red-400">0</span></p>
    <p id="rank-display" class="game-font text-xs text-gray-500 mb-8"></p>
    <button id="view-leaderboard-btn" class="game-font text-sm bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-8 py-4 rounded-lg mb-4">VIEW LEADERBOARD</button>
    <button id="restart-btn" class="game-font text-sm bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white px-8 py-4 rounded-lg">PLAY AGAIN</button>
   </div><!-- Name Input Modal -->
   <div id="name-input-modal" class="absolute inset-0 flex-col items-center justify-center bg-black/95 z-50 hidden">
    <h2 class="game-font text-2xl text-yellow-400 mb-8">ENTER YOUR NAME</h2>
    <input id="player-name-input" type="text" maxlength="20" placeholder="Your Name" class="game-font text-sm bg-gray-800 text-white px-6 py-3 rounded-lg mb-6 text-center border-2 border-gray-600 focus:border-green-400 outline-none">
    <button id="submit-score-btn" class="game-font text-sm bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white px-8 py-4 rounded-lg mb-2">SUBMIT SCORE</button>
    <button id="skip-score-btn" class="game-font text-xs text-gray-500 hover:text-gray-300 mt-2">Skip</button>
   </div><!-- Leaderboard Screen -->
   <div id="leaderboard-screen" class="absolute inset-0 flex-col items-center justify-center bg-gradient-to-b from-gray-900 via-blue-900 to-gray-900 z-50 hidden">
    <h2 class="game-font text-3xl text-yellow-400 mb-8">🏅 TOP SCORES 🏅</h2>
    <div id="leaderboard-list" class="w-full max-w-2xl px-4 mb-8">
     <!-- Dynamically populated -->
    </div>
    <button id="close-leaderboard-btn" class="game-font text-sm bg-gradient-to-r from-gray-600 to-gray-500 hover:from-gray-500 hover:to-gray-400 text-white px-8 py-4 rounded-lg">CLOSE</button>
   </div><!-- Secret Level Select -->
   <div id="level-select" class="absolute inset-0 flex-col items-center justify-center bg-black/95 z-50 hidden">
    <h2 class="game-font text-2xl text-cyan-400 mb-8">LEVEL SELECT</h2>
    <div class="grid grid-cols-5 gap-4 mb-8">
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="0">1</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="1">2</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="2">3</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="3">4</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="4">5</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="5">6</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="6">7</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="7">8</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="8">9</button>
     <button class="level-select-btn game-font text-sm bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white px-6 py-3 rounded-lg transition-all transform hover:scale-105" data-level="9">10</button>
    </div>
    <button id="close-level-select" class="game-font text-xs text-gray-500 hover:text-gray-300">ESC TO CLOSE</button>
   </div>
  </div>
  <script>
    // Game Constants
    const TILE_SIZE = 32;
    const GRAVITY = 0.8;
    const JUMP_FORCE = -14;
    const MOVE_SPEED = 5;
    const BOOST_FORCE = -20;
    
    // Game State
    let canvas, ctx;
    let gameRunning = false;
    let currentLevel = 0;
    let deaths = 0;
    let player = {};
    let keys = {};
    let cameraX = 0;
    let playerFacingRight = true;

    // Secret code detection for level select
    let secretCode = '';
    const SECRET_TRIGGER = 'debug';
    let secretTimeout = null;

    // Fly mode hack
    let flyMode = false;
    const FLY_SPEED = 8;

    // Boss fight state
    let bossActive = false;
    let boss = null;
    let playerHP = 10;
    let bullets = [];
    let bossAttacks = [];
    let lastShootTime = 0;
    const SHOOT_COOLDOWN = 300; // milliseconds
    const BULLET_SPEED = 12;
    let shootTipTimer = 0;
    let showShootTip = false;

    // Audio Manager - Retro Chiptune Sound System
    const AudioManager = {
      ctx: null,
      muted: false,
      bgmGain: null,
      sfxGain: null,
      bgmOscillators: [],
      bgmTimeout: null,

      init() {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();

          // Create gain nodes for volume control
          this.bgmGain = this.ctx.createGain();
          this.bgmGain.connect(this.ctx.destination);
          this.bgmGain.gain.value = 0.3; // BGM at 30% volume

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.connect(this.ctx.destination);
          this.sfxGain.gain.value = 0.4; // SFX at 40% volume

          // Load mute preference from localStorage
          const savedMute = localStorage.getItem('spikeRunnerMuted');
          if (savedMute === 'true') {
            this.muted = true;
            this.bgmGain.gain.value = 0;
            this.sfxGain.gain.value = 0;
          }
        } catch (e) {
          console.warn('Web Audio API not supported', e);
        }
      },

      // Create oscillator helper
      createOscillator(freq, type, duration, gain) {
        if (!this.ctx || this.muted) return null;

        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();

        osc.type = type || 'square'; // Default to square wave for chiptune sound
        osc.frequency.value = freq;

        osc.connect(oscGain);
        oscGain.connect(gain);

        const now = this.ctx.currentTime;
        oscGain.gain.setValueAtTime(0.5, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        osc.start(now);
        osc.stop(now + duration);

        return osc;
      },

      // Play sound effects
      playSound(type) {
        if (!this.ctx || this.muted) return;

        const now = this.ctx.currentTime;

        switch(type) {
          case 'jump':
            // Upward sweep
            const jump = this.ctx.createOscillator();
            const jumpGain = this.ctx.createGain();
            jump.type = 'square';
            jump.connect(jumpGain);
            jumpGain.connect(this.sfxGain);
            jump.frequency.setValueAtTime(200, now);
            jump.frequency.exponentialRampToValueAtTime(400, now + 0.1);
            jumpGain.gain.setValueAtTime(0.3, now);
            jumpGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            jump.start(now);
            jump.stop(now + 0.1);
            break;

          case 'death':
            // Descending chromatic scale
            const deathFreqs = [500, 450, 400, 350, 300, 250, 200, 150, 100];
            deathFreqs.forEach((freq, i) => {
              const death = this.ctx.createOscillator();
              const deathGain = this.ctx.createGain();
              death.type = 'square';
              death.frequency.value = freq;
              death.connect(deathGain);
              deathGain.connect(this.sfxGain);
              const startTime = now + (i * 0.03);
              deathGain.gain.setValueAtTime(0.2, startTime);
              deathGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.03);
              death.start(startTime);
              death.stop(startTime + 0.03);
            });
            break;

          case 'levelComplete':
            // Victory arpeggio: C-E-G-C
            const victoryNotes = [523.25, 659.25, 783.99, 1046.50];
            victoryNotes.forEach((freq, i) => {
              const note = this.ctx.createOscillator();
              const noteGain = this.ctx.createGain();
              note.type = 'square';
              note.frequency.value = freq;
              note.connect(noteGain);
              noteGain.connect(this.sfxGain);
              const startTime = now + (i * 0.15);
              noteGain.gain.setValueAtTime(0.3, startTime);
              noteGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
              note.start(startTime);
              note.stop(startTime + 0.15);
            });
            break;

          case 'victory':
            // Extended victory melody
            const melodyNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
            melodyNotes.forEach((freq, i) => {
              const note = this.ctx.createOscillator();
              const noteGain = this.ctx.createGain();
              note.type = 'square';
              note.frequency.value = freq;
              note.connect(noteGain);
              noteGain.connect(this.sfxGain);
              const startTime = now + (i * 0.12);
              noteGain.gain.setValueAtTime(0.3, startTime);
              noteGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.12);
              note.start(startTime);
              note.stop(startTime + 0.12);
            });
            break;

          case 'boost':
            // High-pitched pulse
            const boost = this.ctx.createOscillator();
            const boostGain = this.ctx.createGain();
            boost.type = 'square';
            boost.frequency.value = 800;
            boost.connect(boostGain);
            boostGain.connect(this.sfxGain);
            boostGain.gain.setValueAtTime(0.3, now);
            boostGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            boost.start(now);
            boost.stop(now + 0.05);
            break;
        }
      },

      // Start background music
      startBGM() {
        if (!this.ctx || this.muted) return;

        // Unlock audio context if suspended
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        this.stopBGM(); // Stop any existing BGM
        this.playBGMLoop();
      },

      // Play BGM loop
      playBGMLoop() {
        if (!this.ctx || this.muted) return;

        const now = this.ctx.currentTime;
        const bpm = 120;
        const beatDuration = 60 / bpm;

        // Melody in C minor (chiptune adventure style)
        const melody = [
          { note: 523.25, duration: 0.5 }, // C
          { note: 493.88, duration: 0.5 }, // B
          { note: 392.00, duration: 0.5 }, // G
          { note: 329.63, duration: 0.5 }, // E
          { note: 392.00, duration: 0.5 }, // G
          { note: 466.16, duration: 0.5 }, // Bb
          { note: 523.25, duration: 0.5 }, // C
          { note: 587.33, duration: 0.5 }, // D
          { note: 523.25, duration: 0.5 }, // C
          { note: 466.16, duration: 0.5 }, // Bb
          { note: 392.00, duration: 0.5 }, // G
          { note: 329.63, duration: 0.5 }, // E
          { note: 293.66, duration: 0.5 }, // D
          { note: 329.63, duration: 0.5 }, // E
          { note: 392.00, duration: 1.0 }, // G
          { note: 0, duration: 0.5 }, // Rest
        ];

        // Bass line
        const bass = [
          { note: 130.81, duration: 1.0 }, // C
          { note: 146.83, duration: 1.0 }, // D
          { note: 164.81, duration: 1.0 }, // E
          { note: 196.00, duration: 1.0 }, // G
          { note: 130.81, duration: 1.0 }, // C
          { note: 146.83, duration: 1.0 }, // D
          { note: 164.81, duration: 1.0 }, // E
          { note: 196.00, duration: 1.0 }, // G
        ];

        let time = 0;
        this.bgmOscillators = [];

        // Play melody
        melody.forEach((note, i) => {
          if (note.note > 0) {
            const osc = this.ctx.createOscillator();
            const oscGain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = note.note;
            osc.connect(oscGain);
            oscGain.connect(this.bgmGain);

            const startTime = now + time;
            const endTime = startTime + (note.duration * beatDuration);

            oscGain.gain.setValueAtTime(0.15, startTime);
            oscGain.gain.exponentialRampToValueAtTime(0.01, endTime);

            osc.start(startTime);
            osc.stop(endTime);
            this.bgmOscillators.push(osc);
          }
          time += note.duration * beatDuration;
        });

        // Play bass
        let bassTime = 0;
        bass.forEach((note, i) => {
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'triangle'; // Softer bass sound
          osc.frequency.value = note.note;
          osc.connect(oscGain);
          oscGain.connect(this.bgmGain);

          const startTime = now + bassTime;
          const endTime = startTime + (note.duration * beatDuration);

          oscGain.gain.setValueAtTime(0.1, startTime);
          oscGain.gain.setValueAtTime(0.1, endTime - 0.05);
          oscGain.gain.exponentialRampToValueAtTime(0.01, endTime);

          osc.start(startTime);
          osc.stop(endTime);
          this.bgmOscillators.push(osc);

          bassTime += note.duration * beatDuration;
        });

        // Schedule next loop
        const loopDuration = time * 1000;
        this.bgmTimeout = setTimeout(() => this.playBGMLoop(), loopDuration);
      },

      // Boss fight music - intense and fast-paced
      playBossBGMLoop() {
        if (!this.ctx || this.muted) return;

        const now = this.ctx.currentTime;
        const bpm = 160; // Faster tempo for boss fight
        const beatDuration = 60 / bpm;

        // Aggressive melody in D minor
        const melody = [
          { note: 587.33, duration: 0.25 }, // D
          { note: 587.33, duration: 0.25 }, // D
          { note: 698.46, duration: 0.25 }, // F
          { note: 587.33, duration: 0.25 }, // D
          { note: 783.99, duration: 0.5 },  // G
          { note: 698.46, duration: 0.5 },  // F
          { note: 587.33, duration: 0.25 }, // D
          { note: 587.33, duration: 0.25 }, // D
          { note: 698.46, duration: 0.25 }, // F
          { note: 587.33, duration: 0.25 }, // D
          { note: 880.00, duration: 0.5 },  // A
          { note: 783.99, duration: 0.5 },  // G
          { note: 698.46, duration: 0.25 }, // F
          { note: 783.99, duration: 0.25 }, // G
          { note: 880.00, duration: 0.25 }, // A
          { note: 932.33, duration: 0.25 }, // Bb
          { note: 880.00, duration: 0.5 },  // A
          { note: 698.46, duration: 0.5 },  // F
        ];

        // Driving bass line
        const bass = [
          { note: 146.83, duration: 0.5 }, // D
          { note: 146.83, duration: 0.5 }, // D
          { note: 174.61, duration: 0.5 }, // F
          { note: 146.83, duration: 0.5 }, // D
          { note: 146.83, duration: 0.5 }, // D
          { note: 146.83, duration: 0.5 }, // D
          { note: 220.00, duration: 0.5 }, // A
          { note: 196.00, duration: 0.5 }, // G
        ];

        let time = 0;
        this.bgmOscillators = [];

        // Play melody with more aggressive tone
        melody.forEach((note, i) => {
          if (note.note > 0) {
            const osc = this.ctx.createOscillator();
            const oscGain = this.ctx.createGain();
            osc.type = 'sawtooth'; // More aggressive sound for boss
            osc.frequency.value = note.note;
            osc.connect(oscGain);
            oscGain.connect(this.bgmGain);

            const startTime = now + time;
            const endTime = startTime + (note.duration * beatDuration);

            oscGain.gain.setValueAtTime(0.12, startTime);
            oscGain.gain.exponentialRampToValueAtTime(0.01, endTime);

            osc.start(startTime);
            osc.stop(endTime);
            this.bgmOscillators.push(osc);
          }
          time += note.duration * beatDuration;
        });

        // Heavy bass line
        let bassTime = 0;
        bass.forEach((note, i) => {
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'square'; // Heavy bass sound
          osc.frequency.value = note.note;
          osc.connect(oscGain);
          oscGain.connect(this.bgmGain);

          const startTime = now + bassTime;
          const endTime = startTime + (note.duration * beatDuration);

          oscGain.gain.setValueAtTime(0.15, startTime);
          oscGain.gain.setValueAtTime(0.15, endTime - 0.05);
          oscGain.gain.exponentialRampToValueAtTime(0.01, endTime);

          osc.start(startTime);
          osc.stop(endTime);
          this.bgmOscillators.push(osc);

          bassTime += note.duration * beatDuration;
        });

        // Schedule next loop
        const loopDuration = time * 1000;
        this.bgmTimeout = setTimeout(() => this.playBossBGMLoop(), loopDuration);
      },

      // Start boss BGM
      startBossBGM() {
        if (!this.ctx || this.muted) return;

        // Unlock audio context if suspended
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        this.stopBGM(); // Stop any existing BGM
        this.playBossBGMLoop();
      },

      // Stop background music
      stopBGM() {
        if (this.bgmTimeout) {
          clearTimeout(this.bgmTimeout);
          this.bgmTimeout = null;
        }
        this.bgmOscillators.forEach(osc => {
          try {
            osc.stop();
          } catch(e) {}
        });
        this.bgmOscillators = [];
      },

      // Toggle mute
      toggleMute() {
        this.muted = !this.muted;

        if (this.muted) {
          this.bgmGain.gain.value = 0;
          this.sfxGain.gain.value = 0;
        } else {
          this.bgmGain.gain.value = 0.3;
          this.sfxGain.gain.value = 0.4;
        }

        // Save preference

      apiUrl: '/api/leaderboard',

      async getTopScores(limit = 10) {
        try {
          const response = await fetch(`${this.apiUrl}?limit=${limit}`);
          const data = await response.json();
          return data.leaderboard || [];
        } catch (error) {
          console.error('Failed to fetch leaderboard:', error);
          return [];
        }
      },

      async submitScore(deaths, playerName) {
        try {
          const response = await fetch(this.apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deaths, playerName })
          });
          const data = await response.json();
          return data;
        } catch (error) {
          console.error('Failed to submit score:', error);
          return { error: 'Network error' };
        }
      },

      async render() {
        const container = document.getElementById('leaderboard-list');
        container.innerHTML = '<p class="game-font text-xs text-gray-400 text-center">Loading...</p>';

        const scores = await this.getTopScores(10);

        if (scores.length === 0) {
          container.innerHTML = '<p class="game-font text-xs text-gray-500 text-center">No scores yet. Be the first!</p>';
          return;
        }

        container.innerHTML = scores.map((score, index) => {
          const date = new Date(score.timestamp || score.date);
          const formattedDate = date.toLocaleDateString();
          const rankClass = index < 3 ? 'text-yellow-400' : 'text-gray-400';
          const deathsClass = index === 0 ? 'text-green-400' : 'text-red-400';

          return `
            <div class="flex justify-between items-center bg-black/50 px-6 py-3 mb-2 rounded-lg">
              <span class="game-font text-sm ${rankClass}">#${score.rank || index + 1}</span>
              <span class="game-font text-xs text-green-400 flex-1 ml-4">${score.playerName}</span>
              <span class="game-font text-xs text-gray-300 mr-4">${formattedDate}</span>
              <span class="game-font text-sm ${deathsClass}">${score.deaths} deaths</span>
            </div>
          `;
        }).join('');
      }

    // Boss Fight System
    function createBoss() {
      boss = {
        x: 800,
        y: 300,
        width: 64,
        height: 64,
        hp: 30,
        maxHP: 30,
        vx: 0,
        vy: 0,
        phase: 0,
        attackTimer: 0,
        attackCooldown: 2000,
        movePattern: 0,
        moveTimer: 0,
        smashing: false,
        smashVelocity: 0,
        smashStartY: 300
      };
      playerHP = 10;
      bossActive = true;
      bullets = [];
      bossAttacks = [];
      showShootTip = true;
      shootTipTimer = 0;
    }

    function updateBoss() {
      if (!boss || !bossActive) return;

      boss.attackTimer += 16;
      boss.moveTimer += 16;

      // Update shoot tip timer
      if (showShootTip) {
        shootTipTimer += 16;
        if (shootTipTimer > 5000) { // Show for 5 seconds
          showShootTip = false;
        }
      }

      // Boss movement patterns
      if (boss.moveTimer > 1000) {
        boss.movePattern = Math.floor(Math.random() * 3);
        boss.moveTimer = 0;
      }

      // Smashing attack movement
      if (boss.smashing) {
        boss.vy = boss.smashVelocity;
        boss.y += boss.vy;
        boss.vx = 0;

        // Check if boss hit the ground (y > 500)
        if (boss.y >= 500) {
          boss.y = 500;
          boss.smashing = false;
          boss.smashVelocity = 0;

          // Create shockwave on impact
          for (let i = -3; i <= 3; i++) {
            bossAttacks.push({
              x: boss.x + boss.width / 2 + (i * 80),
              y: boss.y + boss.height,
              vx: i * 3,
              vy: -8,
              size: 16,
              type: 'shockwave',
              lifetime: 60
            });
          }

          // Sound effect
          AudioManager.playSound('death');

          // Boss bounces back up
          setTimeout(() => {
            boss.y = boss.smashStartY || 300;
          }, 500);
        }
      } else {
        // Normal movement
        if (boss.movePattern === 0) {
          // Hover side to side
          boss.vx = Math.sin(Date.now() / 1000) * 3;
          boss.vy = Math.sin(Date.now() / 800) * 2;
        } else if (boss.movePattern === 1) {
          // Chase player horizontally
          if (player.x < boss.x) boss.vx = -2;
          else boss.vx = 2;
          boss.vy = Math.sin(Date.now() / 600) * 2;
        } else {
          // Circle pattern
          boss.vx = Math.cos(Date.now() / 800) * 4;
          boss.vy = Math.sin(Date.now() / 800) * 4;
        }

        boss.x += boss.vx;
        boss.y += boss.vy;

        // Keep boss in bounds
        if (boss.x < 400) boss.x = 400;
        if (boss.x > 900) boss.x = 900;
        if (boss.y < 100) boss.y = 100;
        if (boss.y > 400) boss.y = 400;
      }

      // Boss attacks based on HP phase
      if (boss.hp > 20) {
        // Phase 1: Slow attacks
        boss.attackCooldown = 2000;
      } else if (boss.hp > 10) {
        // Phase 2: Faster attacks
        boss.attackCooldown = 1500;
      } else {
        // Phase 3: Rapid attacks
        boss.attackCooldown = 1000;
      }

      // Trigger attacks
      if (boss.attackTimer > boss.attackCooldown) {
        boss.attackTimer = 0;
        const attackType = Math.floor(Math.random() * 5); // Now 5 attack types

        if (attackType === 0) {
          // Spiral attack
          for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            bossAttacks.push({
              x: boss.x + boss.width / 2,
              y: boss.y + boss.height / 2,
              vx: Math.cos(angle) * 4,
              vy: Math.sin(angle) * 4,
              size: 8,
              type: 'projectile'
            });
          }
        } else if (attackType === 1) {
          // Aimed shot at player
          const dx = player.x - boss.x;
          const dy = player.y - boss.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          bossAttacks.push({
            x: boss.x + boss.width / 2,
            y: boss.y + boss.height / 2,
            vx: (dx / dist) * 5,
            vy: (dy / dist) * 5,
            size: 12,
            type: 'projectile'
          });
        } else if (attackType === 2) {
          // Wave attack
          for (let i = 0; i < 5; i++) {
            bossAttacks.push({
              x: boss.x + boss.width / 2,
              y: boss.y + boss.height / 2 + (i - 2) * 20,
              vx: -6,
              vy: 0,
              size: 10,
              type: 'projectile'
            });
          }
        } else if (attackType === 3) {
          // Rain attack
          for (let i = 0; i < 3; i++) {
            bossAttacks.push({
              x: 400 + Math.random() * 600,
              y: 50,
              vx: 0,
              vy: 6,
              size: 10,
              type: 'projectile'
            });
          }
        } else {
          // SMASH ATTACK - Boss slams down
          boss.smashing = true;
          boss.smashStartY = boss.y;
          boss.smashVelocity = 15;
        }
      }

      // Update boss attacks
      for (let i = bossAttacks.length - 1; i >= 0; i--) {
        const attack = bossAttacks[i];
        attack.x += attack.vx;
        attack.y += attack.vy;

        // Handle shockwave lifetime
        if (attack.type === 'shockwave') {
          attack.lifetime--;
          if (attack.lifetime <= 0) {
            bossAttacks.splice(i, 1);
            continue;
          }
          // Shockwaves apply gravity
          attack.vy += 0.5;
        }

        // Remove off-screen attacks (except shockwaves)
        if (attack.type !== 'shockwave' && (attack.x < 0 || attack.x > 1200 || attack.y < 0 || attack.y > 700)) {
          bossAttacks.splice(i, 1);
          continue;
        }

        // Check collision with player
        if (!flyMode &&
            attack.x < player.x + player.width &&
            attack.x + attack.size > player.x &&
            attack.y < player.y + player.height &&
            attack.y + attack.size > player.y) {
          playerHP--;
          bossAttacks.splice(i, 1);
          AudioManager.playSound('death');

          if (playerHP <= 0) {
            // Respawn player in boss fight
            deaths++;
            updateHUD();
            playerHP = 10;

            // Reset boss health
            boss.hp = boss.maxHP;

            const level = levels[currentLevel];
            player.x = level.playerStart.x * TILE_SIZE;
            player.y = level.playerStart.y * TILE_SIZE;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            player.onPlatform = null;
            bullets = [];
            bossAttacks = [];

            // Death animation
            const container = document.getElementById('game-container');
            container.classList.add('death-animation');
            setTimeout(() => container.classList.remove('death-animation'), 300);
          }
        }
      }

      // Check if boss defeated
      if (boss.hp <= 0 && bossActive) {
        bossActive = false;

        // Play victory sound
        AudioManager.playSound('levelComplete');

        // Spawn goal tile in the center of the arena (only if it doesn't exist)
        const level = levels[currentLevel];
        const goalExists = level.tiles.some(t => t.type === 5);
        if (!goalExists) {
          level.tiles.push({
            x: 19,
            y: 19,
            type: 5
          });
        }
      }
    }

    function updateBullets() {
      // Update player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        // Remove off-screen bullets
        if (bullet.x < 0 || bullet.x > 1200 || bullet.y < 0 || bullet.y > 700) {
          bullets.splice(i, 1);
          continue;
        }

        // Check collision with boss
        if (boss && bossActive &&
            bullet.x < boss.x + boss.width &&
            bullet.x + 8 > boss.x &&
            bullet.y < boss.y + boss.height &&
            bullet.y + 8 > boss.y) {
          boss.hp--;
          bullets.splice(i, 1);
          AudioManager.playSound('boost');
        }
      }
    }

    function shootBullet() {
      const now = Date.now();
      if (now - lastShootTime < SHOOT_COOLDOWN) return;

      lastShootTime = now;

      // Shoot in the direction player is facing
      const bulletVX = playerFacingRight ? BULLET_SPEED : -BULLET_SPEED;
      const bulletX = playerFacingRight ? player.x + player.width : player.x;

      bullets.push({
        x: bulletX,
        y: player.y + player.height / 2,
        vx: bulletVX,
        vy: 0
      });
      AudioManager.playSound('jump');
    }

    function renderBoss() {
      if (!boss || !bossActive) return;

      ctx.save();
      ctx.translate(-cameraX, 0);

      // Draw boss
      ctx.fillStyle = '#ff00ff';
      ctx.fillRect(boss.x, boss.y, boss.width, boss.height);

      // Boss eyes
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(boss.x + 15, boss.y + 15, 12, 12);
      ctx.fillRect(boss.x + 37, boss.y + 15, 12, 12);

      // Boss HP bar
      const hpWidth = (boss.hp / boss.maxHP) * boss.width;
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(boss.x, boss.y - 10, boss.width, 6);
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(boss.x, boss.y - 10, hpWidth, 6);

      // Draw boss attacks
      bossAttacks.forEach(attack => {
        if (attack.type === 'shockwave') {
          // Shockwave - explosive yellow/orange wave
          ctx.fillStyle = '#ffaa00';
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(attack.x, attack.y, attack.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          // Normal projectile
          ctx.fillStyle = '#ff6600';
          ctx.beginPath();
          ctx.arc(attack.x, attack.y, attack.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Draw player bullets
      ctx.fillStyle = '#00ffff';
      bullets.forEach(bullet => {
        ctx.fillRect(bullet.x, bullet.y, 8, 4);
      });

      ctx.restore();
    }

    function renderBossUI() {
      if (!bossActive && !showShootTip) return;

      // Player HP bar
      if (bossActive) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(20, 60, 220, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '12px "Press Start 2P"';
        ctx.fillText('PLAYER HP', 30, 78);

        ctx.fillStyle = '#333';
        ctx.fillRect(130, 68, 100, 12);
        ctx.fillStyle = playerHP > 3 ? '#00ff00' : '#ff0000';
        ctx.fillRect(130, 68, playerHP * 10, 12);

        // Boss HP bar
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(canvas.width - 240, 60, 220, 30);
        ctx.fillStyle = '#fff';
        ctx.fillText('BOSS HP', canvas.width - 230, 78);

        ctx.fillStyle = '#333';
        ctx.fillRect(canvas.width - 130, 68, 120, 12);
        ctx.fillStyle = '#ff00ff';
        ctx.fillRect(canvas.width - 130, 68, (boss.hp / boss.maxHP) * 120, 12);
      }

      // Tutorial text - PRESS SPACE TO SHOOT
      if (showShootTip) {
        const opacity = Math.max(0, 1 - (shootTipTimer / 5000));
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.fillStyle = '#ffff00';
        ctx.font = '16px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 10;
        ctx.fillText('PRESS SPACE TO SHOOT', canvas.width / 2, canvas.height / 2 + 100);
        ctx.shadowBlur = 0;
        ctx.restore();
        ctx.textAlign = 'left';
      }
    }

    // Initialize Game
    function init() {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      // Input handling
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
          e.preventDefault();
        }
      });
      window.addEventListener('keyup', (e) => keys[e.code] = false);
      
      // Button handlers
      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('next-level-btn').addEventListener('click', nextLevel);
      document.getElementById('restart-btn').addEventListener('click', restartGame);

      // Leaderboard handlers
      document.getElementById('submit-score-btn').addEventListener('click', async () => {
        const playerName = document.getElementById('player-name-input').value.trim() || 'Anonymous';
        const submitBtn = document.getElementById('submit-score-btn');

        // Disable button and show loading state
        submitBtn.textContent = 'SUBMITTING...';
        submitBtn.disabled = true;

        // Submit score to API
        const result = await LeaderboardAPI.submitScore(deaths, playerName);

        // Re-enable button
        submitBtn.textContent = 'SUBMIT SCORE';
        submitBtn.disabled = false;

        // Hide name input modal
        document.getElementById('name-input-modal').classList.add('hidden');
        document.getElementById('name-input-modal').classList.remove('flex');

        // Show game complete screen
        document.getElementById('game-complete').classList.remove('hidden');
        document.getElementById('game-complete').classList.add('flex');

        // Display rank if available
        const rankDisplay = document.getElementById('rank-display');
        if (result.error) {
          rankDisplay.textContent = 'Failed to submit score';
          rankDisplay.className = 'game-font text-xs text-red-400 mb-8';
        } else if (result.rank) {
          const isTopTen = result.rank <= 10;
          rankDisplay.textContent = `Global Rank: #${result.rank}${isTopTen ? ' - Top 10!' : ''}`;
          rankDisplay.className = isTopTen ?
            'game-font text-xs text-green-400 mb-8' :
            'game-font text-xs text-yellow-400 mb-8';
        }

        // Clear input for next time
        document.getElementById('player-name-input').value = '';
      });

      document.getElementById('skip-score-btn').addEventListener('click', () => {
        // Hide name input modal
        document.getElementById('name-input-modal').classList.add('hidden');
        document.getElementById('name-input-modal').classList.remove('flex');

        // Show game complete screen
        document.getElementById('game-complete').classList.remove('hidden');
        document.getElementById('game-complete').classList.add('flex');

        // Clear rank display
        document.getElementById('rank-display').textContent = '';

        // Clear input for next time
        document.getElementById('player-name-input').value = '';
      });

      document.getElementById('view-leaderboard-btn').addEventListener('click', () => {
        // Hide game complete screen
        document.getElementById('game-complete').classList.add('hidden');
        document.getElementById('game-complete').classList.remove('flex');

        // Show leaderboard screen
        document.getElementById('leaderboard-screen').classList.remove('hidden');
        document.getElementById('leaderboard-screen').classList.add('flex');

        // Fetch and render leaderboard
        LeaderboardAPI.render();
      });

      document.getElementById('close-leaderboard-btn').addEventListener('click', () => {
        // Hide leaderboard screen
        document.getElementById('leaderboard-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.remove('flex');

        // Show game complete screen
        document.getElementById('game-complete').classList.remove('hidden');
        document.getElementById('game-complete').classList.add('flex');
      });

      // Allow Enter key to submit score
      document.getElementById('player-name-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('submit-score-btn').click();
        }
      });

      // Initialize audio
      AudioManager.init();
      document.getElementById('mute-btn').addEventListener('click', () => AudioManager.toggleMute());

      // Update mute indicator based on saved preference
      const indicator = document.getElementById('mute-indicator');
      if (AudioManager.muted) {
        indicator.textContent = 'OFF';
        indicator.className = 'text-red-400 ml-2';
      }

      // Secret code detection for level select
      window.addEventListener('keydown', (e) => {
        // Only detect when not in input fields
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        // Ignore special keys (except single letters)
        if (e.key.length > 1) return;

        clearTimeout(secretTimeout);

        // Only add letter keys to the secret code
        if (e.key.match(/[a-z]/i)) {
          secretCode += e.key.toLowerCase();

          // Keep only last 10 characters
          if (secretCode.length > 10) {
            secretCode = secretCode.slice(-10);
          }

          // Check if secret code matches
          if (secretCode.includes(SECRET_TRIGGER)) {
            secretCode = '';
            toggleLevelSelect();
          }

          // Check for fly mode hack
          if (secretCode.includes('fly')) {
            secretCode = '';
            toggleFlyMode();
          }
        }

        // Reset after 3 seconds of no typing
        secretTimeout = setTimeout(() => {
          secretCode = '';
        }, 3000);
      });

      // Level select handlers
      document.querySelectorAll('.level-select-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const levelIndex = parseInt(btn.dataset.level);
          jumpToLevel(levelIndex);
        });
      });

      // Close level select with ESC or click
      document.getElementById('close-level-select').addEventListener('click', closeLevelSelect);
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' && !document.getElementById('level-select').classList.contains('hidden')) {
          closeLevelSelect();
        }
      });
    }
    
    function resizeCanvas() {
      const container = document.getElementById('game-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    // Level select functions
    function toggleLevelSelect() {
      const levelSelect = document.getElementById('level-select');
      levelSelect.classList.remove('hidden');
      levelSelect.classList.add('flex');
      gameRunning = false;
    }

    function closeLevelSelect() {
      const levelSelect = document.getElementById('level-select');
      levelSelect.classList.remove('flex');
      levelSelect.classList.add('hidden');
    }

    function jumpToLevel(levelIndex) {
      closeLevelSelect();

      // Hide start screen if visible
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');

      // Set current level
      currentLevel = levelIndex;

      // Start game
      gameRunning = true;

      // Unlock audio on user interaction
      if (AudioManager.ctx && AudioManager.ctx.state === 'suspended') {
        AudioManager.ctx.resume();
      }

      // Load the level (this will start appropriate music)
      loadLevel(currentLevel);

      // Start game loop
      gameLoop();
    }

    function toggleFlyMode() {
      flyMode = !flyMode;

      // Visual feedback
      const hud = document.getElementById('hud');
      if (flyMode) {
        // Add fly indicator to HUD
        const flyIndicator = document.createElement('div');
        flyIndicator.id = 'fly-indicator';
        flyIndicator.className = 'absolute top-16 right-4 bg-cyan-500/90 px-4 py-2 rounded-lg game-font text-xs';
        flyIndicator.innerHTML = '<span class="text-white">✈ FLY MODE</span>';
        document.getElementById('game-container').appendChild(flyIndicator);
      } else {
        // Remove fly indicator
        const flyIndicator = document.getElementById('fly-indicator');
        if (flyIndicator) {
          flyIndicator.remove();
        }
      }
    }
    
    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      currentLevel = 0;
      deaths = 0;
      gameRunning = true;

      // Unlock audio on user interaction
      if (AudioManager.ctx && AudioManager.ctx.state === 'suspended') {
        AudioManager.ctx.resume();
      }

      loadLevel(currentLevel);

      gameLoop();
    }
    
    function loadLevel(levelIndex) {
      const level = levels[levelIndex];
      player = {
        x: level.playerStart.x * TILE_SIZE,
        y: level.playerStart.y * TILE_SIZE,
        width: TILE_SIZE - 8,
        height: TILE_SIZE - 4,
        vx: 0,
        vy: 0,
        onGround: false,
        onPlatform: null
      };
      cameraX = 0;

      // Initialize moving platforms
      level.movingPlatforms.forEach(p => {
        p.startX = p.x * TILE_SIZE;
        p.startY = p.y * TILE_SIZE;
        p.currentX = p.startX;
        p.currentY = p.startY;
        p.phase = 0;
      });

      // Initialize enemies
      level.tiles.filter(t => t.type === 3).forEach(e => {
        e.startX = e.x * TILE_SIZE;
        e.currentX = e.startX;
        e.direction = 1;
        e.moveRange = TILE_SIZE * 1.5;
      });

      // Level 10: Spawn boss
      if (levelIndex === 9) {
        // Remove any existing goal tiles from Level 10
        level.tiles = level.tiles.filter(t => t.type !== 5);

        createBoss();
        // Start boss music
        if (!AudioManager.muted) {
          AudioManager.stopBGM();
          AudioManager.startBossBGM();
        }
      } else {
        // Reset boss state for other levels
        bossActive = false;
        boss = null;
        bullets = [];
        bossAttacks = [];
        // Return to normal music
        if (!AudioManager.muted && gameRunning) {
          AudioManager.stopBGM();
          AudioManager.startBGM();
        }
      }

      updateHUD();
    }
    
    function updateHUD() {
      document.getElementById('level-display').textContent = currentLevel + 1;
      document.getElementById('death-display').textContent = deaths;
    }
    
    function nextLevel() {
      document.getElementById('level-complete').classList.remove('flex');
      document.getElementById('level-complete').classList.add('hidden');
      currentLevel++;
      loadLevel(currentLevel);
      gameRunning = true;
      gameLoop();
    }
    
    function restartGame() {
      document.getElementById('game-complete').classList.remove('flex');
      document.getElementById('game-complete').classList.add('hidden');
      startGame();
    }
    
    function die() {
      deaths++;
      updateHUD();
      AudioManager.playSound('death');

      // Death animation
      const container = document.getElementById('game-container');
      container.classList.add('death-animation');
      setTimeout(() => container.classList.remove('death-animation'), 300);

      loadLevel(currentLevel);
    }
    
    function completeLevel() {
      gameRunning = false;
      if (currentLevel >= levels.length - 1) {
        // Game complete
        AudioManager.playSound('victory');
        document.getElementById('final-deaths').textContent = deaths;

        // Show name input modal
        document.getElementById('name-input-modal').classList.remove('hidden');
        document.getElementById('name-input-modal').classList.add('flex');

        // Focus on input field
        setTimeout(() => {
          document.getElementById('player-name-input').focus();
        }, 100);
      } else {
        AudioManager.playSound('levelComplete');
        document.getElementById('level-complete').classList.remove('hidden');
        document.getElementById('level-complete').classList.add('flex');
      }
    }
    
    function gameLoop() {
      if (!gameRunning) return;
      
      update();
      render();
      requestAnimationFrame(gameLoop);
    }
    
    function update() {
      const level = levels[currentLevel];
      
      // Update moving platforms
      level.movingPlatforms.forEach(p => {
        p.phase += p.speed;
        const offset = Math.sin(p.phase * Math.PI * 2);
        p.currentX = p.startX + offset * p.moveX * TILE_SIZE;
        p.currentY = p.startY + offset * p.moveY * TILE_SIZE;
      });
      
      // Update enemies
      level.tiles.filter(t => t.type === 3).forEach(e => {
        e.currentX += e.direction * 1;
        if (Math.abs(e.currentX - e.startX) > e.moveRange) {
          e.direction *= -1;
        }
      });
      
      // Player movement
      let moveX = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) {
        moveX = -MOVE_SPEED;
        playerFacingRight = false;
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        moveX = MOVE_SPEED;
        playerFacingRight = true;
      }

      player.vx = moveX;

      // Fly mode controls
      if (flyMode) {
        let moveY = 0;
        if (keys['ArrowUp'] || keys['KeyW']) moveY = -FLY_SPEED;
        if (keys['ArrowDown'] || keys['KeyS']) moveY = FLY_SPEED;
        if (keys['Space']) moveY = -FLY_SPEED;
        player.vy = moveY;
      } else {
        // Boss fight shooting
        if (bossActive) {
          if (keys['Space']) {
            shootBullet();
          }
          // Jump with W/Up only during boss fight
          if ((keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            AudioManager.playSound('jump');
          }
        } else {
          // Normal jump
          if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
            player.vy = JUMP_FORCE;
            player.onGround = false;
            AudioManager.playSound('jump');
          }
        }

        // Apply gravity (only when not flying)
        player.vy += GRAVITY;
        if (player.vy > 15) player.vy = 15;
      }
      
      // Move with platform
      if (player.onPlatform) {
        const plat = player.onPlatform;
        const prevX = plat.prevX || plat.currentX;
        const prevY = plat.prevY || plat.currentY;
        player.x += plat.currentX - prevX;
        player.y += plat.currentY - prevY;
        plat.prevX = plat.currentX;
        plat.prevY = plat.currentY;
      }
      
      // Horizontal collision
      player.x += player.vx;
      const hTiles = getCollidingTiles(player, level);
      hTiles.forEach(tile => {
        if (tile.type === 1) {
          if (player.vx > 0) {
            player.x = tile.x * TILE_SIZE - player.width;
          } else if (player.vx < 0) {
            player.x = (tile.x + 1) * TILE_SIZE;
          }
        }
      });
      
      // Vertical collision
      player.y += player.vy;
      player.onGround = false;

      // Only reset platform if player walked off horizontally
      if (player.onPlatform) {
        const plat = player.onPlatform;
        const platX = plat.currentX;
        const platWidth = plat.width * TILE_SIZE;
        // Check if player is still horizontally over the platform
        if (player.x + player.width < platX || player.x > platX + platWidth) {
          player.onPlatform = null;
        }
      }
      
      const vTiles = getCollidingTiles(player, level);
      vTiles.forEach(tile => {
        if (tile.type === 1) {
          if (player.vy > 0) {
            player.y = tile.y * TILE_SIZE - player.height;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0) {
            player.y = (tile.y + 1) * TILE_SIZE;
            player.vy = 0;
          }
        }
      });
      
      // Moving platform collision
      level.movingPlatforms.forEach(plat => {
        const platRect = {
          x: plat.currentX,
          y: plat.currentY,
          width: plat.width * TILE_SIZE,
          height: TILE_SIZE
        };

        // Check if player is on or near the platform
        const playerBottom = player.y + player.height;
        const playerPrevBottom = playerBottom - player.vy;

        // Horizontal overlap check
        const horizontalOverlap = player.x < platRect.x + platRect.width &&
                                   player.x + player.width > platRect.x;

        // Check if player is landing on platform from above
        if (horizontalOverlap && player.vy >= 0) {
          // More forgiving collision - check if player's bottom is near platform top
          if (playerBottom >= platRect.y && playerPrevBottom <= platRect.y + 8) {
            player.y = platRect.y - player.height;
            player.vy = 0;
            player.onGround = true;
            player.onPlatform = plat;
          }
        }
      });
      
      // Check hazards
      vTiles.concat(hTiles).forEach(tile => {
        if (tile.type === 2 && !flyMode) die(); // Spike (disabled in fly mode)
        if (tile.type === 4 && !flyMode) { // Boost (disabled in fly mode)
          player.vy = BOOST_FORCE;
          player.onGround = false;
          AudioManager.playSound('boost');
        }
        if (tile.type === 5) completeLevel(); // Goal (always works)
      });

      // Enemy collision (disabled in fly mode)
      if (!flyMode) {
        level.tiles.filter(t => t.type === 3).forEach(e => {
          const enemyRect = {
            x: e.currentX + 4,
            y: e.y * TILE_SIZE + 4,
          width: TILE_SIZE - 8,
          height: TILE_SIZE - 8
        };
        if (rectIntersect(player, enemyRect)) {
          die();
        }
      });
      }

      // Fall death (disabled in fly mode)
      if (!flyMode && player.y > level.height * TILE_SIZE) {
        die();
      }

      // Update boss fight
      if (bossActive) {
        updateBoss();
        updateBullets();
      }

      // Camera follow
      const targetCameraX = player.x - canvas.width / 2;
      cameraX += (targetCameraX - cameraX) * 0.1;
      cameraX = Math.max(0, Math.min(cameraX, level.width * TILE_SIZE - canvas.width));
    }
    
    function getCollidingTiles(rect, level) {
      const colliding = [];
      level.tiles.forEach(tile => {
        const tileRect = {
          x: tile.x * TILE_SIZE,
          y: tile.y * TILE_SIZE,
          width: TILE_SIZE,
          height: TILE_SIZE
        };
        if (rectIntersect(rect, tileRect)) {
          colliding.push(tile);
        }
      });
      return colliding;
    }
    
    function rectIntersect(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }
    
    function render() {
      const level = levels[currentLevel];
      
      // Clear with gradient background
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#1a1a2e');
      gradient.addColorStop(1, '#16213e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw grid (subtle)
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = -cameraX % TILE_SIZE; x < canvas.width; x += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      
      ctx.save();
      ctx.translate(-cameraX, 0);
      
      // Draw tiles
      level.tiles.forEach(tile => {
        const x = tile.x * TILE_SIZE;
        const y = tile.y * TILE_SIZE;
        
        switch(tile.type) {
          case 1: // Platform
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = '#718096';
            ctx.fillRect(x, y, TILE_SIZE, 4);
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(x, y + TILE_SIZE - 4, TILE_SIZE, 4);
            break;
            
          case 2: // Spike
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(x + TILE_SIZE/2, y);
            ctx.lineTo(x + TILE_SIZE, y + TILE_SIZE);
            ctx.lineTo(x, y + TILE_SIZE);
            ctx.closePath();
            ctx.fill();
            // Glow
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
            break;
            
          case 3: // Enemy
            const ex = tile.currentX || x;
            ctx.fillStyle = '#a855f7';
            ctx.beginPath();
            ctx.arc(ex + TILE_SIZE/2, y + TILE_SIZE/2, TILE_SIZE/2 - 4, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ex + TILE_SIZE/3, y + TILE_SIZE/3, 4, 0, Math.PI * 2);
            ctx.arc(ex + TILE_SIZE*2/3, y + TILE_SIZE/3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(ex + TILE_SIZE/3, y + TILE_SIZE/3, 2, 0, Math.PI * 2);
            ctx.arc(ex + TILE_SIZE*2/3, y + TILE_SIZE/3, 2, 0, Math.PI * 2);
            ctx.fill();
            break;
            
          case 4: // Boost
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.moveTo(x + TILE_SIZE/2, y + 4);
            ctx.lineTo(x + TILE_SIZE - 4, y + TILE_SIZE/2);
            ctx.lineTo(x + TILE_SIZE/2 + 4, y + TILE_SIZE/2);
            ctx.lineTo(x + TILE_SIZE/2 + 4, y + TILE_SIZE - 4);
            ctx.lineTo(x + TILE_SIZE/2 - 4, y + TILE_SIZE - 4);
            ctx.lineTo(x + TILE_SIZE/2 - 4, y + TILE_SIZE/2);
            ctx.lineTo(x + 4, y + TILE_SIZE/2);
            ctx.closePath();
            ctx.fill();
            ctx.shadowColor = '#22c55e';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            break;
            
          case 5: // Goal
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
            ctx.fillStyle = '#fef3c7';
            ctx.fillRect(x + 8, y + 8, TILE_SIZE - 16, TILE_SIZE - 16);
            // Star
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            const cx = x + TILE_SIZE/2;
            const cy = y + TILE_SIZE/2;
            for (let i = 0; i < 5; i++) {
              const angle = (i * 4 * Math.PI / 5) - Math.PI/2;
              const r = i % 2 === 0 ? 8 : 4;
              if (i === 0) ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
              else ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fill();
            break;
        }
      });
      
      // Draw moving platforms
      level.movingPlatforms.forEach(plat => {
        ctx.fillStyle = '#60a5fa';
        ctx.fillRect(plat.currentX, plat.currentY, plat.width * TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#93c5fd';
        ctx.fillRect(plat.currentX, plat.currentY, plat.width * TILE_SIZE, 4);
      });
      
      // Draw player
      ctx.fillStyle = '#10b981';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      // Player highlight
      ctx.fillStyle = '#34d399';
      ctx.fillRect(player.x, player.y, player.width, 4);
      // Player eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.x + 4, player.y + 6, 6, 6);
      ctx.fillRect(player.x + player.width - 10, player.y + 6, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(player.x + 6, player.y + 8, 3, 3);
      ctx.fillRect(player.x + player.width - 8, player.y + 8, 3, 3);

      // Draw boss and bullets
      renderBoss();

      ctx.restore();

      // Draw boss UI (outside camera transform)
      renderBossUI();
    }
    
    // Start initialization
    init();
  </script>
